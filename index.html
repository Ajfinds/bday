<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <style>
      :root {
        --bg-1: #120b1d;
        --bg-2: #1d1231;
        --bg-3: #2c1d3f;
        --gold: #ffd77a;
        --gold-soft: #fff0bf;
        --pink: #ff7ec7;
        --purple: #a78bfa;
        --blue: #7dd3fc;
        --rose: #ffb6d9;
        --paper: #fdf5ff;
        --paper-2: #f8ebff;
        --ink: #2d184b;
        --muted: #735c9a;
        --shadow: rgba(8, 6, 17, 0.7);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at 15% 15%, rgba(255, 126, 182, 0.22), transparent 18%),
          radial-gradient(circle at 80% 12%, rgba(125, 211, 252, 0.2), transparent 18%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 35%, var(--bg-3));
        color: white;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .ambient {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.75;
      }

      .glow.one {
        width: 350px;
        height: 350px;
        background: rgba(255, 126, 182, 0.24);
        top: 10%;
        left: 10%;
      }

      .glow.two {
        width: 420px;
        height: 420px;
        background: rgba(167, 139, 250, 0.23);
        right: 8%;
        bottom: 8%;
      }

      .confetti {
        position: absolute;
        inset: 0;
      }

      .confetti span {
        position: absolute;
        width: 10px;
        height: 18px;
        top: -20%;
        border-radius: 3px;
        animation: fall 11s linear infinite;
        opacity: 0;
      }

      @keyframes fall {
        0% { transform: translateY(-8vh) rotate(0deg); opacity: 0; }
        12% { opacity: 1; }
        100% { transform: translateY(110vh) rotate(370deg); opacity: 0; }
      }

      .scene {
        position: relative;
        width: min(92vw, 760px);
        height: min(88vh, 820px);
        display: grid;
        place-items: center;
      }

      .envelope-wrap {
        position: relative;
        width: min(90vw, 620px);
        height: 420px;
        display: grid;
        place-items: center;
        cursor: pointer;
        user-select: none;
        perspective: 1400px;
      }

      .envelope {
        position: relative;
        width: min(76vw, 560px);
        height: 330px;
        border-radius: 14px;
        background: linear-gradient(180deg, #d8d2f8 0%, #e8defd 26%, #f3ebff 100%);
        box-shadow: 0 40px 80px rgba(12, 7, 22, 0.62), 0 12px 30px rgba(143, 107, 255, 0.18);
        overflow: visible;
        transition: transform 0.8s ease;
      }

      .envelope:hover {
        transform: translateY(-4px);
      }

      .envelope .paper {
        position: absolute;
        inset: 20px 22px 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.9));
        border: 1px solid rgba(120, 84, 170, 0.2);
        border-radius: 10px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
        transition: transform 0.9s ease, opacity 0.9s ease, box-shadow 0.9s ease;
        overflow: hidden;
      }

      .envelope .paper-inner {
        position: absolute;
        inset: 0;
        padding: 26px 30px;
        display: grid;
        place-items: center;
        text-align: center;
        background: linear-gradient(180deg, rgba(253, 248, 255, 0.55), rgba(248, 235, 255, 0.92));
      }

      .small-tag {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 215, 122, 0.18);
        border: 1px solid rgba(255, 215, 122, 0.5);
        color: var(--ink);
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .birthday-text {
        margin: 16px 0 0;
        font-size: clamp(2.1rem, 5vw, 4rem);
        letter-spacing: -0.08em;
        line-height: 0.9;
        font-weight: 800;
        color: transparent;
        background: linear-gradient(135deg, #8b5cf6 0%, #ff7ec7 34%, #f59e0b 70%, #fef3c7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        text-shadow: 0 6px 18px rgba(255, 104, 179, 0.18);
      }

      .birthday-sub {
        margin-top: 12px;
        font-size: 0.78rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .envelope .flap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 180px;
        background: linear-gradient(180deg, #f5ecff 0%, #dbd0fa 100%);
        clip-path: polygon(0% 0%, 50% 64%, 100% 0%, 100% 100%, 0% 100%);
        border-bottom: 1px solid rgba(95, 66, 135, 0.2);
        transform-origin: top center;
        transition: transform 0.9s ease, filter 0.5s ease;
        z-index: 3;
      }

      .envelope .flap::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
      }

      .envelope .left, .envelope .right {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(180deg, rgba(219, 208, 250, 0.92), rgba(195, 172, 246, 0.9));
        z-index: 2;
      }

      .envelope .left {
        left: 0;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
      }

      .envelope .right {
        right: 0;
        clip-path: polygon(0 50%, 100% 0, 100% 100%);
      }

      .envelope .seal {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff7d6, #ffd77a 35%, #ffaf5a 100%);
        box-shadow: 0 12px 24px rgba(255, 182, 75, 0.28);
        border: 3px solid rgba(255, 255, 255, 0.7);
        z-index: 5;
        display: grid;
        place-items: center;
        font-size: 2rem;
        color: rgba(82, 44, 19, 0.9);
        transition: transform 0.8s ease, opacity 0.8s ease;
      }

      .seal::before {
        content: "✦";
      }

      .envelope-wrap.open .flap {
        transform: rotateX(180deg);
        filter: brightness(1.02);
      }

      .envelope-wrap.open .paper {
        transform: translateY(-30px) scale(1.02);
        box-shadow: 0 18px 28px rgba(128, 93, 170, 0.18);
      }

      .envelope-wrap.open .seal {
        transform: translate(-50%, -50%) scale(0.7);
        opacity: 0;
      }

      .hint {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.68rem;
        color: rgba(255, 255, 255, 0.8);
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
      }

      @media (max-width: 560px) {
        .envelope-wrap {
          height: 360px;
        }

        .envelope {
          height: 290px;
        }

        .envelope .paper-inner {
          padding: 18px 18px;
        }

        .birthday-text {
          font-size: 2.4rem;
        }

        .birthday-sub {
          letter-spacing: 0.15em;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient">
      <div class="glow one"></div>
      <div class="glow two"></div>
      <div class="confetti" aria-hidden="true">
        <span style="left: 6%; background: #ff7ec7; animation-delay: 0s;"></span>
        <span style="left: 14%; background: #ffd77a; animation-delay: 1.2s;"></span>
        <span style="left: 22%; background: #7dd3fc; animation-delay: 0.8s;"></span>
        <span style="left: 31%; background: #a78bfa; animation-delay: 2.4s;"></span>
        <span style="left: 41%; background: #ff7ec7; animation-delay: 1.6s;"></span>
        <span style="left: 50%; background: #ffd77a; animation-delay: 2.8s;"></span>
        <span style="left: 61%; background: #7dd3fc; animation-delay: 1.4s;"></span>
        <span style="left: 71%; background: #a78bfa; animation-delay: 3.2s;"></span>
        <span style="left: 81%; background: #ff7ec7; animation-delay: 0.5s;"></span>
        <span style="left: 90%; background: #ffd77a; animation-delay: 2.1s;"></span>
      </div>
    </div>

    <div class="scene">
      <div class="envelope-wrap" id="envelopeWrap" aria-label="Open birthday envelope" tabindex="0" role="button">
        <div class="envelope">
          <div class="left"></div>
          <div class="right"></div>
          <div class="flap"></div>
          <div class="seal"></div>

          <div class="paper">
            <div class="paper-inner">
              <div class="small-tag">Birthday Wishes</div>
              <div class="birthday-text">Happy<br />Birthday</div>
              <div class="birthday-sub">To someone extraordinary</div>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">Touch to open</div>
    </div>

    <script>
      const envelopeWrap = document.getElementById('envelopeWrap');

      function toggleOpen() {
        envelopeWrap.classList.toggle('open');
      }

      envelopeWrap.addEventListener('click', toggleOpen);
      envelopeWrap.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleOpen();
        }
      });
    </script>
  </body>
</html>
